<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stone Paper Scissors</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .card {
    background: #ffffff;
    border-radius: 28px;
    padding: 36px 30px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    max-width: 430px;
    width: 100%;
    text-align: center;
  }
  h1 { color: #1f2937; margin-bottom: 6px; font-size: 30px; letter-spacing: -0.5px; }
  p.subtitle { color: #6b7280; margin-bottom: 26px; font-size: 16px; }
  .score {
    display: flex;
    justify-content: space-between;
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 24px;
    color: #111827;
  }
  .choice-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 26px;
  }
  .choice-btn {
    aspect-ratio: 1;
    background: #f3f4f6;
    border: 4px solid transparent;
    border-radius: 24px;
    font-size: 44px;
    cursor: pointer;
    transition: all 0.12s ease;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .choice-btn:hover { background: #e5e7eb; transform: translateY(-2px); }
  .choice-btn:active { transform: scale(0.9); }
  .choice-btn.selected {
    border-color: #667eea;
    background: #eef2ff;
  }
  .result-area { margin: 26px 0; min-height: 150px; }
  .result-text {
    font-size: 26px;
    font-weight: 900;
    margin-bottom: 12px;
    height: 36px;
    color: #374151;
  }
  .computer-choice { font-size: 56px; margin-bottom: 14px; line-height: 1; }
  .message { color: #4b5563; font-size: 16px; margin-bottom: 0; height: 22px; }
  .reset-btn {
    background: #667eea;
    color: #ffffff;
    border: none;
    padding: 14px 28px;
    border-radius: 16px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    touch-action: manipulation;
    transition: opacity 0.1s;
    -webkit-tap-highlight-color: transparent;
  }
  .reset-btn:hover { opacity: 0.92; }
  .reset-btn:active { transform: scale(0.98); }
  .stats {
    margin-top: 28px;
    padding-top: 22px;
    border-top: 1px solid #e5e7eb;
    font-size: 14px;
    color: #9ca3af;
  }
</style>
</head>
<body>
<div class="card">
  <h1>Stone Paper Scissors</h1>
  <p class="subtitle">Tap your move</p>
  <div class="score">
    <span>You: <span id="userScore">0</span></span>
    <span>Computer: <span id="compScore">0</span></span>
  </div>
  <div class="choice-grid">
    <button class="choice-btn" data-choice="stone">🪨</button>
    <button class="choice-btn" data-choice="paper">📄</button>
    <button class="choice-btn" data-choice="scissor">✂️</button>
  </div>
  <div class="result-area">
    <div class="result-text" id="resultText">Make your move</div>
    <div class="computer-choice" id="computerChoice">?</div>
    <div class="message" id="message">First to 3 wins!</div>
  </div>
  <button class="reset-btn" id="resetBtn">Reset Score</button>
  <div class="stats">
    Rounds: <span id="rounds">0</span>
  </div>
</div>

<script>
const choices = ['stone', 'paper', 'scissor'];
const emojiMap = { stone: '🪨', paper: '📄', scissor: '✂️' };
let userScore = 0;
let compScore = 0;
let rounds = 0;
let gameOver = false;

const userScoreEl = document.getElementById('userScore');
const compScoreEl = document.getElementById('compScore');
const resultTextEl = document.getElementById('resultText');
const computerChoiceEl = document.getElementById('computerChoice');
const messageEl = document.getElementById('message');
const roundsEl = document.getElementById('rounds');
const choiceBtns = document.querySelectorAll('.choice-btn');
const resetBtn = document.getElementById('resetBtn');

function getComputerChoice() {
  return choices[Math.floor(Math.random() * choices.length)];
}

function determineWinner(user, comp) {
  if (user === comp) return 'tie';
  const beats = { stone: 'scissor', paper: 'stone', scissor: 'paper' };
  return beats[user] === comp ? 'user' : 'computer';
}

function updateUI() {
  userScoreEl.textContent = userScore;
  compScoreEl.textContent = compScore;
  roundsEl.textContent = rounds;
}

function handleChoice(userChoice) {
  if (gameOver) return;

  choiceBtns.forEach(btn => {
    btn.classList.remove('selected');
    if (btn.dataset.choice === userChoice) btn.classList.add('selected');
  });

  const compChoice = getComputerChoice();
  computerChoiceEl.textContent = emojiMap[compChoice];

  const winner = determineWinner(userChoice, compChoice);
  rounds++;

  if (winner === 'user') {
    userScore++;
    resultTextEl.textContent = 'You Win!';
    resultTextEl.style.color = '#10b981';
    messageEl.textContent = `${emojiMap[userChoice]} beats ${emojiMap[compChoice]}`;
  } else if (winner === 'computer') {
    compScore++;
    resultTextEl.textContent = 'You Lose!';
    resultTextEl.style.color = '#ef4444';
    messageEl.textContent = `${emojiMap[compChoice]} beats ${emojiMap[userChoice]}`;
  } else {
    resultTextEl.textContent = "It's a Tie!";
    resultTextEl.style.color = '#d97706';
    messageEl.textContent = `Both chose ${emojiMap[userChoice]}`;
  }

  updateUI();

  if (userScore >= 3 || compScore >= 3) {
    gameOver = true;
    setTimeout(() => {
      const winnerMsg = userScore > compScore ? '🎉 You won the match!' : '😔 Computer won the match!';
      messageEl.textContent = winnerMsg;
      setTimeout(() => alert(winnerMsg + '\n\nFinal Score — You ' + userScore + ' : ' + compScore + ' Computer'), 100);
    }, 500);
  }
}

choiceBtns.forEach(btn => {
  btn.addEventListener('click', () => handleChoice(btn.dataset.choice));
});

resetBtn.addEventListener('click', () => {
  userScore = 0;
  compScore = 0;
  rounds = 0;
  gameOver = false;
  choiceBtns.forEach(btn => btn.classList.remove('selected'));
  computerChoiceEl.textContent = '?';
  resultTextEl.textContent = 'Make your move';
  resultTextEl.style.color = '#374151';
  messageEl.textContent = 'First to 3 wins!';
  updateUI();
});

document.addEventListener('keydown', (e) => {
  if (gameOver) return;
  const key = e.key.toLowerCase();
  if (key === '1' || key === 's') handleChoice('stone');
  if (key === '2' || key === 'p') handleChoice('paper');
  if (key === '3' || key === 'c') handleChoice('scissor');
});

updateUI();
</script>
</body>
</html>
