<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Stone Paper Scissors</title>
<!-- Monetization & Ad SDK Abstraction Layer -->
<script src="./monetization.js"></script>
<!-- The Playables SDK (optional, guarded for web portals) -->
<script src="https://www.youtube.com/game_api/v1"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent;
       -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex; align-items: center; justify-content: center;
    padding: calc(12px + env(safe-area-inset-top, 0px)) 12px calc(12px + env(safe-area-inset-bottom, 0px));
    touch-action: manipulation;
  }
  .card {
    position: relative; background: #fff; border-radius: 28px;
    padding: clamp(16px, 4vh, 32px) 24px; width: 100%; max-width: 430px; max-height: 100%;
    text-align: center; box-shadow: 0 24px 60px rgba(0,0,0,.35); overflow: hidden;
  }
  h1 { color: #1f2937; font-size: clamp(24px, 4.5vh, 30px); letter-spacing: -.5px; margin-bottom: 4px; }
  .subtitle { color: #6b7280; font-size: 15px; margin-bottom: clamp(10px, 2.5vh, 20px); }
  .score { display: flex; justify-content: space-between; font-size: 20px; font-weight: 800; color: #111827; margin-bottom: clamp(10px, 2.5vh, 18px); }
  .pips { display: block; font-size: 12px; letter-spacing: 3px; color: #667eea; margin-top: 2px; height: 14px; }

  .arena { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 10px; }
  .hand {
    width: 96px; height: 96px; border-radius: 24px; background: #f3f4f6;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 48px; line-height: 1;
  }
  .hand small { font-size: 11px; font-weight: 700; color: #9ca3af; margin-top: 6px; letter-spacing: .5px; }
  .hand.win { background: #d1fae5; } .hand.lose { background: #fee2e2; }
  .hand.shake { animation: shake .12s linear infinite; }
  @keyframes shake { 50% { transform: translateY(-5px) rotate(-4deg); } }
  .vs { font-weight: 800; color: #9ca3af; }
  .result-text { font-size: 26px; font-weight: 900; height: 34px; color: #374151; margin-bottom: 4px; }
  .message { color: #4b5563; font-size: 16px; height: 22px; margin-bottom: clamp(10px, 2.5vh, 20px); }

  .choice-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: clamp(10px, 2.5vh, 20px); }
  .choice-btn {
    aspect-ratio: 1; max-height: 15vh; width: 100%; justify-self: center;
    background: #f3f4f6; border: 4px solid transparent; border-radius: 24px;
    font-size: clamp(32px, 6.5vh, 44px); cursor: pointer; transition: transform .1s, background .1s;
  }
  .choice-btn:hover:not(:disabled) { background: #e5e7eb; }
  .choice-btn:active:not(:disabled) { transform: scale(.9); }
  .choice-btn:disabled { opacity: .5; cursor: default; }
  .choice-btn.selected { border-color: #667eea; background: #eef2ff; }
  .choice-btn:focus-visible, .btn:focus-visible { outline: 3px solid #764ba2; outline-offset: 2px; }

  .btn { background: #667eea; color: #fff; border: none; padding: 14px 28px; border-radius: 16px;
         font-size: 16px; font-weight: 700; cursor: pointer; width: 100%; }
  .btn:active { transform: scale(.98); }
  .btn.ghost { background: #eef2ff; color: #4338ca; }
  .stats { margin-top: clamp(10px, 2.5vh, 18px); padding-top: 12px; border-top: 1px solid #e5e7eb;
           font-size: 14px; color: #6b7280; display: flex; justify-content: space-around; }

  #matchOver { position: absolute; inset: 0; background: rgba(255,255,255,.96); z-index: 5;
               display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
  #matchOver.hidden { display: none; }
  #matchOver .big { font-size: 64px; margin-bottom: 8px; }
  #matchOver h2 { font-size: 28px; color: #1f2937; margin-bottom: 6px; }
  #matchOver p { color: #6b7280; margin-bottom: 22px; }
  @media (prefers-reduced-motion: reduce) { .hand.shake { animation: none; } }
</style>
</head>
<body>
<div class="card">
  <h1>Stone Paper Scissors</h1>
  <p class="subtitle">First to 3 wins the match</p>
  <div class="score">
    <span>You: <span id="userScore">0</span></span>
    <span>Computer: <span id="compScore">0</span></span>
  </div>

  <div class="arena">
    <div class="hand" id="userHand"><span id="userEmoji">?</span><small>YOU</small></div>
    <div class="vs">VS</div>
    <div class="hand" id="compHand"><span id="compEmoji">?</span><small>COMPUTER</small></div>
  </div>
  <div class="result-text" id="resultText">Make your move</div>
  <div class="message" id="message">&nbsp;</div>

  <div class="choice-grid">
    <button class="choice-btn" data-choice="stone" aria-label="Stone">🪨</button>
    <button class="choice-btn" data-choice="paper" aria-label="Paper">📄</button>
    <button class="choice-btn" data-choice="scissor" aria-label="Scissors">✂️</button>
  </div>
  <button class="btn ghost" id="resetBtn">New match</button>

  <div class="stats">
    <span>Matches won: <b id="wonStat">0</b></span>
    <span>Best streak: <b id="streakStat">0</b></span>
  </div>

  <div id="matchOver" class="hidden">
    <div class="big" id="moEmoji">🎉</div>
    <h2 id="moTitle">You won the match!</h2>
    <p id="moScore">Final score 3 : 0</p>
    <div style="display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 260px; margin: 0 auto;">
      <button class="btn" id="bonusStreakBtn" style="background: linear-gradient(135deg, #a855f7, #6366f1); color: #fff;">🎁 Double Score (Watch Ad)</button>
      <button class="btn" id="againBtn">Play again</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ---------- Playables SDK (guarded so the file also runs as a normal page) ----------
  const yt = window.ytgame || null;
  const inYT = !!(yt && yt.IN_PLAYABLES_ENV);
  function safe(fn) {
    try { return fn(); }
    catch (e) { console.warn(e); try { yt && yt.health && yt.health.logError(); } catch (_) {} }
  }

  // ---------- Data ----------
  const choices = ['stone', 'paper', 'scissor'];
  const emoji = { stone: '🪨', paper: '📄', scissor: '✂️' };
  const beats = { stone: 'scissor', paper: 'stone', scissor: 'paper' };
  const WIN_AT = 3;
  let userScore = 0, compScore = 0, busy = false, over = false;
  let saved = { won: 0, streak: 0, best: 0 };   // streak = consecutive matches won
  const timers = new Set();

  const $ = id => document.getElementById(id);
  const btns = document.querySelectorAll('.choice-btn');

  // ---------- Audio (respects the YouTube mute setting) ----------
  let audioOn = true, ac = null;
  if (yt) safe(() => {
    audioOn = yt.system.isAudioEnabled();
    yt.system.onAudioEnabledChange(v => { audioOn = v; if (ac) (v ? ac.resume() : ac.suspend()); });
    yt.system.onPause(() => { if (ac) ac.suspend(); });
    yt.system.onResume(() => { if (ac && audioOn) ac.resume(); });
  });
  function tone(freq, start, dur, type, vol) {
    if (!audioOn) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + start;
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur);
    } catch (e) {}
  }
  const sfx = {
    tap:  () => tone(420, 0, .06, 'square', .03),
    win:  () => { tone(523, 0, .12, 'triangle', .07); tone(784, .1, .2, 'triangle', .07); },
    lose: () => { tone(300, 0, .15, 'sawtooth', .05); tone(200, .12, .25, 'sawtooth', .05); },
    tie:  () => tone(400, 0, .15, 'triangle', .05)
  };

  // ---------- Saved data ----------
  function load() {
    if (inYT) {
      return Promise.resolve().then(() => yt.game.loadData()).then(d => {
        if (d) { const o = JSON.parse(d); saved.won = o.won | 0; saved.streak = o.streak | 0; saved.best = o.best | 0; }
      }).catch(() => {});
    }
    try { Object.assign(saved, JSON.parse(localStorage.getItem('sps_save') || '{}')); } catch (e) {}
    return Promise.resolve();
  }
  function save() {
    const s = JSON.stringify(saved);
    if (inYT) safe(() => yt.game.saveData(s));
    else { try { localStorage.setItem('sps_save', s); } catch (e) {} }
  }

  // ---------- UI helpers ----------
  function later(fn, ms) {
    const id = setTimeout(() => { timers.delete(id); fn(); }, ms);
    timers.add(id);
  }
  function clearTimers() { timers.forEach(clearTimeout); timers.clear(); }
  function pips(n) { return '●'.repeat(n) + '○'.repeat(WIN_AT - n); }
  function render() {
    $('userScore').innerHTML = userScore + '<span class="pips">' + pips(userScore) + '</span>';
    $('compScore').innerHTML = compScore + '<span class="pips">' + pips(compScore) + '</span>';
    $('wonStat').textContent = saved.won;
    $('streakStat').textContent = saved.best;
  }
  function setBusy(b) { busy = b; btns.forEach(x => x.disabled = b || over); }

  function newMatch() {
    clearTimers();
    userScore = compScore = 0; over = false;
    btns.forEach(x => x.classList.remove('selected'));
    $('userEmoji').textContent = '?'; $('compEmoji').textContent = '?';
    $('userHand').className = 'hand'; $('compHand').className = 'hand';
    $('resultText').textContent = 'Make your move'; $('resultText').style.color = '#374151';
    $('message').innerHTML = '&nbsp;';
    $('matchOver').classList.add('hidden');
    setBusy(false); render();
  }

  // ---------- Round ----------
  function play(user) {
    if (busy || over) return;
    setBusy(true); sfx.tap();
    btns.forEach(x => x.classList.toggle('selected', x.dataset.choice === user));
    $('userEmoji').textContent = emoji[user];
    $('userHand').className = 'hand'; $('compHand').className = 'hand shake';
    $('resultText').textContent = '…'; $('resultText').style.color = '#374151';
    $('message').innerHTML = '&nbsp;';

    // Computer "shuffles" briefly, then reveals
    let i = 0;
    const spin = setInterval(() => { $('compEmoji').textContent = emoji[choices[i++ % 3]]; }, 90);
    timers.add(spin);
    later(() => {
      clearInterval(spin); timers.delete(spin);
      reveal(user, choices[Math.floor(Math.random() * 3)]);
    }, 550);
  }

  function reveal(user, comp) {
    $('compEmoji').textContent = emoji[comp];
    $('compHand').className = 'hand';
    const r = $('resultText');
    if (user === comp) {
      r.textContent = "It's a tie!"; r.style.color = '#d97706';
      $('message').textContent = 'Both chose ' + emoji[user]; sfx.tie();
    } else if (beats[user] === comp) {
      userScore++; r.textContent = 'You win!'; r.style.color = '#10b981';
      $('userHand').classList.add('win'); $('compHand').classList.add('lose');
      $('message').textContent = emoji[user] + ' beats ' + emoji[comp]; sfx.win();
    } else {
      compScore++; r.textContent = 'You lose!'; r.style.color = '#ef4444';
      $('userHand').classList.add('lose'); $('compHand').classList.add('win');
      $('message').textContent = emoji[comp] + ' beats ' + emoji[user]; sfx.lose();
    }
    render();
    if (userScore >= WIN_AT || compScore >= WIN_AT) { over = true; later(endMatch, 800); }
    setBusy(false);
  }

  function endMatch() {
    const won = userScore > compScore;
    if (won) {
      saved.won++; saved.streak++; saved.best = Math.max(saved.best, saved.streak);
      if (inYT) safe(() => yt.engagement.sendScore({ value: saved.won }));
    } else {
      saved.streak = 0;
    }
    save(); render();
    $('moEmoji').textContent = won ? '🎉' : '😔';
    $('moTitle').textContent = won ? 'You won the match!' : 'Computer won the match';
    $('moScore').textContent = 'Final score ' + userScore + ' : ' + compScore;
    const bonusStreakBtn = $('bonusStreakBtn');
    if (bonusStreakBtn) {
      bonusStreakBtn.style.display = won ? 'block' : 'none';
    }
    $('matchOver').classList.remove('hidden');
    $('againBtn').focus();
  }

  // ---------- Events ----------
  btns.forEach(b => b.addEventListener('click', () => play(b.dataset.choice)));
  
  $('resetBtn').addEventListener('click', () => {
    if (window.AdManager && AdManager.adCount > 0) {
      AdManager.showMidroll(() => newMatch());
    } else {
      newMatch();
    }
  });

  $('againBtn').addEventListener('click', () => {
    if (window.AdManager) {
      AdManager.showMidroll(() => newMatch());
    } else {
      newMatch();
    }
  });

  const bonusStreakBtn = $('bonusStreakBtn');
  if (bonusStreakBtn) {
    bonusStreakBtn.addEventListener('click', () => {
      if (window.AdManager) {
        AdManager.showRewarded(() => {
          saved.won += 2;
          saved.streak += 1;
          saved.best = Math.max(saved.best, saved.streak);
          save();
          render();
          bonusStreakBtn.style.display = 'none';
          $('moScore').textContent = 'Bonus applied! Final score ' + userScore + ' : ' + compScore;
        }, () => {
          alert('Rewarded ad could not be completed.');
        });
      }
    });
  }

  document.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === '1' || k === 's') play('stone');
    else if (k === '2' || k === 'p') play('paper');
    else if (k === '3' || k === 'c') play('scissor');
  });
  window.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('error', () => { if (inYT) safe(() => yt.health.logError()); });

  // Lifecycle listeners
  function setAppMuted(mute) {
    if (!ac) return;
    if (mute) {
      if (ac.state === 'running') ac.suspend();
    } else {
      if (ac.state === 'suspended' && audioOn) ac.resume();
    }
  }

  document.addEventListener('visibilitychange', () => {
    setAppMuted(document.hidden);
  });
  window.addEventListener('blur', () => setAppMuted(true));
  window.addEventListener('focus', () => {
    if (!document.hidden) setAppMuted(false);
  });

  if (window.AdManager) {
    AdManager.onPauseGame(() => setAppMuted(true));
    AdManager.onResumeGame(() => {
      if (!document.hidden) setAppMuted(false);
    });
  }

  // ---------- Boot ----------
  if (window.AdManager) {
    AdManager.init();
  }
  render();
  if (inYT) safe(() => yt.game.firstFrameReady());   // first frame is on screen
  load().then(() => {
    render();
    if (inYT) safe(() => yt.game.gameReady());       // saved data loaded, game is interactive
  });
})();
</script>
</body>
</html>
